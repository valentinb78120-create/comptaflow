# Frontend SPA + reverse-proxy vers l'API
# Un seul domaine = pas de CORS, cookies/headers simples.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques avec cache long (les noms sont hashés par Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Résolution paresseuse via le DNS interne Docker : nginx démarre et
    # survit même si le service api est momentanément absent/redémarré.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API → service backend (réseau Docker interne)
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;      # uploads de factures (20 Mo + marge)
        proxy_read_timeout 120s;       # OCR long
    }

    # Docs Swagger (pratique en recette, à restreindre/retirer en prod stricte)
    location ~ ^/(docs|redoc|openapi.json) {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # SPA : toute autre route → index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
