# ============================================================================
# CI ComptaFlow — tests backend + build frontend à chaque push/PR
# Se déclenche automatiquement une fois le repo poussé sur GitHub.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dépendances système (Tesseract + poppler)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra poppler-utils

      - name: Dépendances Python
        run: pip install -r requirements.txt

      - name: Tests unitaires
        # Les tests d'intégration se skippent d'eux-mêmes (API non démarrée)
        run: python -m pytest

  frontend-build:
    name: Build frontend (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances
        run: npm ci || npm install

      - name: Build (TypeScript strict + Vite)
        run: npm run build

  docker-build:
    name: Build images Docker prod
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build image backend
        run: docker build -t comptaflow-api ./backend

      - name: Build image frontend prod
        run: docker build -f frontend/Dockerfile.prod -t comptaflow-frontend ./frontend
