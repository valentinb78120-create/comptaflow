# ============================================================================
# ComptaFlow — PRODUCTION
#
# Usage (sur le serveur) :
#   1. Créer un fichier .env.prod à la racine (voir .env.prod.example)
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   3. docker compose -f docker-compose.prod.yml exec api alembic upgrade head
#
# Différences vs dev :
#   - code copié dans l'image (pas de volume), pas de --reload
#   - uvicorn multi-workers
#   - DB/Redis non exposés sur l'hôte
#   - frontend buildé et servi par nginx (port 80) qui proxifie /api
#   - secrets injectés par variables (jamais de défauts faibles)
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-comptaflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-comptaflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-comptaflow}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-comptaflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_SECRET_KEY: ${APP_SECRET_KEY:?définir APP_SECRET_KEY (python -c "import secrets;print(secrets.token_hex(32))")}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_MONTHLY: ${STRIPE_PRICE_ID_MONTHLY:-}
      ENFORCE_SUBSCRIPTION: ${ENFORCE_SUBSCRIPTION:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.comptaflow.fr}
      DEBUG: "false"
    volumes:
      - uploads_data:/tmp/comptaflow/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips "*"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-comptaflow}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-comptaflow}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - uploads_data:/tmp/comptaflow/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=2 --max-tasks-per-child=50

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
